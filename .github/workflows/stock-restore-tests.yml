name: Stock restoration tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  stock-restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare local PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"

      - name: Run isolated stock restoration tests
        run: npm run test:restore-stock
